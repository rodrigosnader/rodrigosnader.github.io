    - paragraph [ref=e334]: "These axes are not a sequential pipeline. They operate at different levels and different phases:"
    - code [ref=e336]: ┌─────────────────────────────────────────────────┐ │ TRAINING TIME │ │ │ │ Continuous Learning (Axis 5) │ │ - Multiple loss functions │ │ - Online weight updates │ │ │ ├─────────────────────────────────────────────────┤ │ ARCHITECTURE │ │ │ │ Input ──► Compute ──► Memory ──► Output │ │ (Axis 1) (Axis 2) (Axis 3) │ │ │ │ Model Plasticity (Axis 4) spans all stages │ │ │ ├─────────────────────────────────────────────────┤ │ SYSTEM LEVEL │ │ │ │ Small Model + Memory + Tools (Axis 6) │ │ - Orchestration │ │ - External memory │ │ - Tool use │ │ - Continuous input streams │ │ │ └─────────────────────────────────────────────────┘
    - paragraph [ref=e337]:
      - strong [ref=e338]: "Dependencies:"
    - list [ref=e339]:
      - listitem [ref=e340]: – Axis 2 (Adaptive Compute) benefits from Axis 1 (better input representation reduces sequence length)
      - listitem [ref=e341]: – Axis 3 (Memory) benefits from Axis 2 (adaptive compute decides what to store vs. discard)
      - listitem [ref=e342]: – Axis 5 (Continuous Learning) requires Axis 3 (somewhere to store what's learned)
      - listitem [ref=e343]: – Axis 6 (System) integrates all other axes
    - paragraph [ref=e344]:
      - strong [ref=e345]: "Independent research tracks:"
    - list [ref=e346]:
      - listitem [ref=e347]: – Axes 1 and 4 can be pursued independently
      - listitem [ref=e348]: – Axes 2 and 3 are tightly coupled
      - listitem [ref=e349]: – Axis 5 benefits from all others but can be researched in isolation
