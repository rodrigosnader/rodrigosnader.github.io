    - paragraph [ref=e413]: "For these proposals to be worth pursuing, they need to be falsifiable. Here's what would indicate each direction is a dead end:"
    - list [ref=e414]:
      - listitem [ref=e415]:
        - text: –
        - strong [ref=e416]: "Adaptive compute (Axis 2):"
        - text: if models with fixed full-context processing consistently outperform adaptive variants even when controlling for total FLOPs, the overhead of deciding what to process exceeds the savings from skipping.
      - listitem [ref=e417]:
        - text: –
        - strong [ref=e418]: "Hierarchical memory (Axis 3):"
        - text: if information compressed into medium-term memory degrades quality on downstream tasks more than the compute savings justify, compression is a net negative.
      - listitem [ref=e419]:
        - text: –
        - strong [ref=e420]: "Model plasticity (Axis 4):"
        - text: if variable-capacity models fail to outperform fixed-size models of equivalent average compute, the routing/allocation overhead doesn't pay for itself.
      - listitem [ref=e421]:
        - text: –
        - strong [ref=e422]: "Continuous learning (Axis 5):"
        - text: if catastrophic forgetting remains unsolvable without losing more capability than the adaptation gains, frozen models with periodic retraining are strictly better.
      - listitem [ref=e423]:
        - text: –
        - strong [ref=e424]: "Small model + system (Axis 6):"
        - text: if robustness and reliability scale with parameter count in ways that external systems fundamentally cannot compensate for, there's a hard floor on model size that memory and tools can't lower.
    - paragraph [ref=e425]: These are empirical questions. The answers may differ by domain, task type, and deployment context.
    - separator [ref=e426]
