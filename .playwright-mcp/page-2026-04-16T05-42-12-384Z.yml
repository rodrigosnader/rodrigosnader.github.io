        - text: Switch between four dependency graphs. If the arrows form a loop, the explanation is circular — it never grounds out. If they reach primitive nodes (things you'd accept without further explanation), the explanation is rigorous. The first two are broken. The last two actually bottom out.
    - heading "The why-test" [level=2] [ref=e47]
    - paragraph [ref=e48]:
      - text: There's a way to catch this. Take any explanation and keep asking
      - emphasis [ref=e49]: why
      - text: ", the way a child does before learning when to stop. Each answer is a new claim; ask why again. One of three things happens."
    - paragraph [ref=e50]: You ground out. You reach something primitive — a physical mechanism, a definition, an observation you can point at — and the chain stops naturally. Ask why a refrigerator keeps food cold and you'll walk through compressor cycles, refrigerant phase changes, thermodynamics. Each step sits on the one below it.
    - paragraph [ref=e51]: You run out of budget. You hit a place where going further would take you into a different field entirely, but the chain so far is solid. That's fine. Rigor doesn't mean bottoming out in particle physics. It means knowing where you stopped and that the floor held.
    - paragraph [ref=e52]: You loop. You reach a claim you already passed through. "Why is this code slow?" "Performance bottleneck." "What's the bottleneck?" "The part that makes it slow." You're back where you started.
    - paragraph [ref=e53]: The loop is the interesting case. It's almost always invisible from the inside — your head holds a circular explanation comfortably, and the return to the starting point registers as "arriving at the answer." The circle fits inside working memory, which is exactly why it feels like progress. Writing the chain down is what makes the loop visible. Linear text is harder to fool than a train of thought.
    - heading "The illusion of explanatory depth" [level=2] [ref=e54]
    - paragraph [ref=e55]: There's a reason circular explanations sit so comfortably in your head. Psychologists call it the illusion of explanatory depth. Ask someone how well they understand how a zipper works, and they'll rate themselves high. Then ask them to actually explain it — step by step, mechanism included. Within about three sentences, their confidence drops.
    - paragraph [ref=e56]: "The self-assessment was based on a label: \"I know how zippers work.\" The label was attached to a vague image of teeth interlocking, not to a working model of how the slider forces them to engage. The why-test drops the label and asks for the model."
    - paragraph [ref=e57]: I think this applies to more than anyone is comfortable admitting. You "know" what a neural network does until someone asks what one neuron does and why the multiplication is there. The first layer of understanding is a label, and the label rests on familiarity, not on mechanism.
    - generic [ref=e58]:
      - generic [ref=e59]: Honest tension
      - paragraph [ref=e60]: You can't ground everything. At some point you take a concept as primitive and stop pushing. A physicist grounds in fields. A chemist stops at the atom. A cook stops at "salt." None of this is wrong. The discipline isn't "always go deeper" — it's knowing where you stopped, and being honest that you stopped there.
    - heading "Top-down as scaffolding" [level=2] [ref=e61]
    - paragraph [ref=e62]: Top-down explanation isn't the enemy. "A neural network is a function that maps inputs to outputs by stacking layers of weighted sums and nonlinearities" — that's top-down, and it's useful. It gives you the shape of the thing before you open it up.
    - paragraph [ref=e63]: The problem is top-down that never touches the ground. A scaffold that doesn't reach the earth isn't a scaffold. Good explanations use top-down to orient and bottom-up to deliver. The textbooks that leave you confused after you finish them are usually the ones that stayed in the air.
    - heading "One check" [level=2] [ref=e64]
    - paragraph [ref=e65]: "I've mostly been talking about other people's explanations, but the most useful version of this is turned inward. Next time you're writing or teaching or trying to argue for something, pause and trace: where does this bottom out?"
    - paragraph [ref=e66]: Every argument has a floor. A good one knows where its floor is. A bad one has a trap door in the middle that cycles back to the roof.
