  - article [ref=e16]:
    - generic [ref=e17]:
      - heading "Explanations that don't eat their tail" [level=1] [ref=e18]
      - paragraph [ref=e19]:
        - time [ref=e20]: 2026 · Apr 16
        - text: · 6 min read · Essay
    - paragraph [ref=e21]: "\"What's a radius?\""
    - paragraph [ref=e22]: "\"Half the diameter.\""
    - paragraph [ref=e23]: "\"And a diameter?\""
    - paragraph [ref=e24]: "\"Twice the radius.\""
    - paragraph [ref=e25]: Both sentences are true. Together they explain nothing. If you didn't know what a radius was before reading them, you still don't. Each definition props up the other; neither one touches the ground.
    - paragraph [ref=e26]: "I keep coming back to this pattern — not just in math definitions, but in code documentation, product explanations, the way people describe their own ideas. Something that sounds like an explanation, passes a casual reading, and collapses under one round of \"but why?\" The shape of the failure is always the same: a loop, disguised as a chain."
    - heading "Levels mean dependency" [level=2] [ref=e27]
    - paragraph [ref=e28]: "\"Higher-level\" and \"lower-level\" aren't about grandeur. They're about dependency. If you need concept B to make sense of concept A, then B is lower than A. That's all."
    - paragraph [ref=e29]: "Radius and diameter are at the same level — neither depends on the other. You can define both by dropping one step: \"a circle is all the points equidistant from a center; the radius is that distance; the diameter is twice that distance.\" Now both rest on \"distance\" and \"point,\" which most people accept without further justification. Each layer sits on something cheaper underneath. That's how explanations are supposed to work."
    - paragraph [ref=e30]: Consider the moon phases. You can say the moon is always half-lit by the sun, and the shape we see changes because our viewing angle changes — a geometric consequence of where we're standing. Or you can say "the moon is waxing." The first grounds in light and geometry. The second restates the observation with a fancier word.
    - paragraph [ref=e31]: This is easier to see in code. A function that calls itself without a base case blows the stack — the compiler refuses. Natural language has no such enforcement. Circular explanations compile just fine in English, which is why careful writers do the check by hand.
    - heading "The dormitive virtue" [level=2] [ref=e32]
    - paragraph [ref=e33]:
      - text: Molière staged the canonical version of this trap in 1673. In
      - emphasis [ref=e34]: Le Malade imaginaire
      - text: ", a medical candidate is asked why opium makes people sleep. He answers, in impressive Latin, that opium possesses a"
      - emphasis [ref=e35]: virtus dormitiva
      - text: — a "dormitive virtue" — whose nature is to cause the senses to slumber.
    - paragraph [ref=e36]: "Translated: opium makes you sleepy because it has a sleepiness-making quality. The Latin dresses up the phenomenon as a cause."
    - paragraph [ref=e37]: This matters because the trick scales. Replace "dormitive virtue" with any sufficiently technical-sounding mechanism, and the same empty move passes inspection. "Opium triggers the opioid receptors, which induce sleep." Is that an explanation? Only if someone can cash it out — ion channels, membrane potentials, signaling cascades, actual mechanism underneath the label. Until then, it's a promissory note. The phenomenon got a new name; the circle just got wider.
