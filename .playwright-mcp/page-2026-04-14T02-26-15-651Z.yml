        - generic [ref=e85]: Fig 1C
        - text: The whole square is everyone in the population. The top strip is the sick group; the big bottom strip is the healthy group. The solid orange bit is "sick and tests positive"; the striped bit is "healthy and tests positive anyway." Your real chance of being sick given a positive is mostly whichever of the two positive regions is bigger.
    - paragraph [ref=e86]: Drag the prevalence slider below 1% and watch what happens. The solid "sick and positive" region shrinks into invisibility, while the striped "healthy and positive anyway" region barely changes. Almost every positive result is now a false alarm, and your real chance of being sick drops toward zero.
    - paragraph [ref=e87]: Drag it past 10% and the opposite happens. The solid region dominates. Your real chance of being sick climbs. Nothing about the test itself has changed — what changed is how common the disease is, and the same positive result means something different against a different background.
    - heading "Where the textbook names fit" [level=2] [ref=e88]
    - paragraph [ref=e89]: "If you go look up Bayes after this, you'll run into the same three ingredients — prior, likelihood, evidence — and now they map onto something concrete:"
    - list [ref=e90]:
      - listitem [ref=e91]:
        - strong [ref=e92]: Prior
        - text: — the 1-in-100 you started with. What you knew before the test.
      - listitem [ref=e93]:
        - strong [ref=e94]: Likelihood
        - text: — the 95%. How often the signal shows up when your guess is right.
      - listitem [ref=e95]:
        - strong [ref=e96]: Evidence
        - text: — the 5.9%. How often the signal shows up at all.
    - paragraph [ref=e97]: The formulas wrap those three numbers into a fraction and spit out the 16%. You already did the whole thing in prose — the math is just a shorter way to write it down.
    - generic [ref=e98]:
      - generic [ref=e99]: Honest caveat
      - paragraph [ref=e100]: The "because vs anyway" framing makes the rule feel easy — and for this test, it is. For messier problems, computing the two frequencies can get subtle, and at some point the underlying algebra earns its keep. The math doesn't go away. It just helps to start from the question.
    - heading "Why this matters outside of tests" [level=2] [ref=e101]
    - paragraph [ref=e102]: "The same question applies outside of medical tests. A suspicious email in your inbox: how often do real phishing attempts look like this, versus how often do legitimate messages happen to sound like this? A candidate with an impressive résumé: how often do great engineers have résumés like that, versus how often do mediocre ones polish theirs to look the same? A scientific result with a low p-value: how often does a real effect produce this, versus how often does chance alone?"
    - paragraph [ref=e103]:
      - text: The questions rhyme because it's the same question. Bayes is just the habit of always asking both halves instead of just the first. Most of the bad inference in the world — hiring mistakes, medical panic, conspiracy theories that "explain everything" — comes from forgetting to ask the second half. The signal looks strong, and you don't check how strong the signal is
      - emphasis [ref=e104]: anyway
      - text: .
    - paragraph [ref=e105]:
      - text: This is the same cognitive blind spot I poked at in the
      - link "skepticism post" [ref=e106] [cursor=pointer]:
        - /url: /posts/skepticism.html
      - text: ", from a different angle. False statements vastly outnumber true ones; weak evidence for something is still mostly evidence for nothing, because \"nothing\" is so much larger."
    - heading "The whole rule, one more time" [level=2] [ref=e107]
    - paragraph [ref=e108]: "Bayes' rule is the habit of asking, for any piece of evidence:"
    - paragraph [ref=e109]:
      - emphasis [ref=e110]: how much more often does this happen when my guess is right, compared to how often it happens anyway?
    - paragraph [ref=e111]: That's the whole rule. The formulas and the three-part jargon are all ways of writing that one comparison down precisely. Once you have the habit, the rest is just notation.
