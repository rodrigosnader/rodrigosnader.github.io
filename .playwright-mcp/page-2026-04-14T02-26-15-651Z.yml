      - heading "The one thing Bayes actually says" [level=1] [ref=e17]
      - paragraph [ref=e18]:
        - time [ref=e19]: 2026 · Apr 12
        - text: · 8 min read · Essay
    - paragraph [ref=e20]: You just tested positive for a disease. The test is "95% accurate." How worried should you be?
    - paragraph [ref=e21]: Most people's gut says "95% worried." Mine certainly did. The honest answer is usually much lower, and the way to get there is called Bayes' rule.
    - paragraph [ref=e22]: "If you've ever tried to look up what Bayes' rule is, you know the shape of it: an equation with three ingredients (prior, likelihood, evidence) that you're supposed to hold in your head and keep straight. I came away the first few times with a vague sense that Bayes was important and no real idea how to use it."
    - paragraph [ref=e23]: Here's where I think the textbook might fail. It decomposes the rule into three parts because the algebra has three parts. Then it tries to give each part a name and a role, which bleed into each other, and the student ends up with an equation that feels like separate ingredients being whisked around for no clear reason.
    - paragraph [ref=e24]: "I spent an afternoon arguing with a language model until the whole thing made sense, boiled down to one question:"
    - generic [ref=e25]:
      - generic [ref=e26]: The question
      - paragraph [ref=e27]:
        - text: Is this evidence happening
        - emphasis [ref=e28]: because
        - text: my belief is true, or is it happening
        - emphasis [ref=e29]: anyway
        - text: "?"
    - paragraph [ref=e30]:
      - text: "Or, for this specific case: is this positive test the evidence showing up"
      - emphasis [ref=e31]: because
      - text: I'm actually sick my belief is true — or does it read positive for healthy people happen anyway
      - emphasis [ref=e32]: anyway
      - text: "?"
    - paragraph [ref=e33]: That's the entire rule. Once you have the question, everything else — prior, likelihood, evidence — starts to make sense. But I'm guessing that sentence doesn't land yet. It only clicks once you watch it play out on something real. Let's walk through the positive test slowly.
    - heading "Your positive test, slowly" [level=2] [ref=e34]
    - paragraph [ref=e35]: Picture 100 random people walking in to take the test. Say one of them is actually sick and all of them do the test. The test catches that one person ~95% of the time — so even with that person sick, you'd have "0.95" people (proportionally, of course) caught as sick. The other 99 are healthy, but 5% of them get flagged by mistake — another 4.95 positives from healthy people.
    - paragraph [ref=e36]:
      - text: "Total positives in a group of 100: about"
      - strong [ref=e37]: "5.9"
      - text: .
    - paragraph [ref=e38]:
      - text: Notice how out of those 5.9 positives, only 0.95 came from someone who was actually sick. The other 4.95 are false alarms. So if your own test is positive, your chance of really being sick is 0.95 out of 5.9 — roughly
      - strong [ref=e39]: 16%
      - text: .
    - paragraph [ref=e40]: Not 95%. Sixteen. There are just so many more healthy people to be wrong about than sick people to be right about, and the false positives swamp the real ones.
