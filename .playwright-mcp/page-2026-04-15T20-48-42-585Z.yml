      - generic [ref=e45]:
        - generic [ref=e46]: Fig 1
        - text: Click a concept and watch its dependency graph light up. If the graph grounds out in primitive nodes — things you'd accept without further explanation — the explanation is
        - emphasis [ref=e47]: rigorous
        - text: . If it loops back on itself, the cycle lights up in red, and the explanation is
        - emphasis [ref=e48]: circular
        - text: . The two bad examples are broken. The two good ones really do bottom out.
    - heading "The why-test" [level=2] [ref=e49]
    - paragraph [ref=e50]:
      - text: Take any explanation you're unsure about and start asking
      - emphasis [ref=e51]: why
      - text: like an irritating child. Each answer is a new claim; ask why of that one. Keep going. One of three things will happen.
    - paragraph [ref=e52]: You ground out. You reach a claim that feels primitive — a physical mechanism, a mathematical definition, a sense observation, something you don't feel the need to push further. The explanation is rigorous, at least from here down.
    - paragraph [ref=e53]:
      - text: You run out of budget. You reach a place where further questioning would require a different field of expertise, but the chain you traced so far is sound. That's fine. Rigor doesn't require you to ground in the Standard Model; it requires you to ground
      - emphasis [ref=e54]: somewhere solid
      - text: ", and to acknowledge where you stopped."
    - paragraph [ref=e55]: You loop. You reach a claim you already passed through. At that point the explanation is broken, and you should know it's broken before you build anything on top of it.
    - paragraph [ref=e56]: "The loop case is the interesting one, because the loop is usually invisible in the moment. You don't notice you're back where you started until someone else is patient enough to trace the chain. This is why writing things down helps: linear prose forces the loop to become visible. Your head can hold a circular explanation and feel productive about it, because the circle fits inside working memory and the return-to-start feels like \"arriving at the answer.\""
    - heading "The illusion of explanatory depth" [level=2] [ref=e57]
    - paragraph [ref=e58]:
      - text: "Psychologists have a name for what's happening in your head when you fall for a circular explanation: the"
      - emphasis [ref=e59]: illusion of explanatory depth
      - text: (Rozenblit & Keil, 2002). Ask someone how confident they are that they understand how a zipper works, and they'll rate themselves pretty high. Then ask them to actually explain how a zipper works, step by step, mechanism included. Their confidence plummets within about three sentences. The self-assessment was based on a
      - emphasis [ref=e60]: label
      - text: — "I know how zippers work" — and the label was indexed to a vague mental image, not to a working model.
    - paragraph [ref=e61]: This applies to everything. You "know" what a neural network does, until someone asks what one neuron does and why the multiplication is there. The first layer of understanding is held up by the label, and the label is held up by nothing. The why-test drops the label and asks for the mechanism.
    - generic [ref=e62]:
      - generic [ref=e63]: Honest tension
      - paragraph [ref=e64]: You can't ground everything. At some point you have to take a concept as primitive, and different communities accept different primitives. A physicist is willing to push down to fields. A chemist usually stops at the atom. A cook stops at "salt" and isn't pretending otherwise. None of this is wrong. Rigor isn't about grounding forever — it's about knowing where you stopped and why that floor was safe.
    - heading "Top-down isn't a sin" [level=2] [ref=e65]
    - paragraph [ref=e66]:
      - text: Top-down is great as
      - emphasis [ref=e67]: scaffolding
      - text: . "A neural network is a function that maps inputs to outputs by stacking layers of weighted sums and nonlinearities" is a top-down sentence and it's useful — it tells you the shape of the thing before you dive into the pieces.
    - paragraph [ref=e68]:
      - text: The problem isn't top-down. The problem is top-down that
      - emphasis [ref=e69]: never
      - text: touches the ground. A scaffold that never touches the ground isn't a scaffold. Good writing uses top-down to orient the reader and then grinds through the bottom-up to actually deliver the payoff. Most textbooks do some of this. The ones that don't are the ones you still feel confused by after finishing.
    - heading "One takeaway" [level=2] [ref=e70]
    - paragraph [ref=e71]:
      - text: "I've mostly been talking about reading other people's explanations, but the most useful application of this is to your own. The next time you catch yourself writing or teaching or trying to convince someone of something, pause and ask:"
      - emphasis [ref=e72]: where does this bottom out?
      - text: Every argument has a floor, and a good one knows what its floor is. A bad one has either no floor or a secret trap door in the middle that cycles back to the top.
    - paragraph [ref=e73]: You can make a lot of your thinking sharper by just doing this one check. Not on every sentence — that would be exhausting — but on any claim that seems to be doing heavy lifting. Trace it down. See if it grounds. If it doesn't, you've been holding the air and calling it a building.
