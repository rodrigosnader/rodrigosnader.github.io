  - article [ref=e15]:
    - generic [ref=e16]:
      - heading "Explanations that don't eat their tail" [level=1] [ref=e17]
      - paragraph [ref=e18]:
        - time [ref=e19]: 2026 · Apr 15
        - text: · 7 min read · Essay
    - paragraph [ref=e20]: A radius is half the length of a diameter.
    - paragraph [ref=e21]: And a diameter? A diameter is twice the length of a radius.
    - paragraph [ref=e22]: Done. You should now know what a radius is.
    - paragraph [ref=e23]: Except you don't. The two sentences above are mutually consistent, each one is individually true, and together they explain nothing. If you didn't know what a radius was before reading them, you still don't. I can keep talking — I can tell you that circumference equals π times diameter, and that π is the ratio of circumference to diameter — but every sentence I add will rest on a word that only makes sense in terms of another word I'm also defining. The whole structure floats, held up by its own hair.
    - paragraph [ref=e24]: This is what an explanation eating its own tail looks like. Once you can see it, a surprising amount of expert prose turns out to be exactly this — including mine, sometimes.
    - heading "Concepts are dependencies, not sizes" [level=2] [ref=e25]
    - paragraph [ref=e26]:
      - text: "\"Higher-level\" and \"lower-level\" concepts are not about grandeur. They're about dependency. A concept B is"
      - emphasis [ref=e27]: lower
      - text: than concept A if you need B to make sense of A. To explain a molecule, you need "atom" already available, because a molecule is atoms bonded together. To explain an atom, you need "electron" and "nucleus", because that's what an atom is made of. The dependency goes one way. You ground down, not sideways.
    - paragraph [ref=e28]: Radius and diameter sit at the same level. Neither depends on the other. You can define both in terms of a simpler idea — "a circle is the set of all points equidistant from a center; the radius is that distance, the diameter is twice that distance" — and now the dependency graph drops one step to "distance" and "point" and "center", which most readers will accept without further definition. That's how explanations are supposed to work. Each layer earns its keep by sitting on something cheaper underneath.
    - paragraph [ref=e29]: Programming is where this discipline is easiest to see. You can't write a function that depends on itself without eventually causing the stack to blow up — the compiler refuses. Prose has no such enforcement. Circular explanations compile just fine in natural language, which is why careful writers keep doing the check by hand.
    - paragraph [ref=e30]: If your explanation can't do this — if it's a graph of concepts that all depend on each other and never reach anything primitive — it's broken.
    - heading "The dormitive virtue" [level=2] [ref=e31]
    - paragraph [ref=e32]:
      - text: Molière staged this in 1673. In
      - emphasis [ref=e33]: Le Malade imaginaire
      - text: ", a would-be doctor is being examined on what makes opium put people to sleep. He answers, in impressive Latin, that opium has a"
      - emphasis [ref=e34]: virtus dormitiva
      - text: "whose nature is to cause the senses to slumber. Translated: \"opium makes you sleepy because it has a sleepiness-making quality.\" He passes the exam. He should not have."
    - paragraph [ref=e35]: "\"Dormitive virtue\" is a label stuck on the phenomenon it was supposed to explain. The phenomenon is \"opium makes you sleepy.\" The explanation is \"opium has a sleepiness-making thing in it.\" Ask what the sleepiness-making thing is, and the only answer the explanation can offer is \"it's the thing that makes opium make you sleepy\" — sending you back to where you started. The explanation is a loop, and the loop has one step."
    - paragraph [ref=e36]: This matters because the trick is almost undetectable when you do it with modern vocabulary. Replace "dormitive virtue" with any sufficiently impressive-sounding receptor, mechanism, or brand of theory, and the same empty move slides past most readers.
    - paragraph [ref=e37]: "Consider: \"opium triggers the opioid receptors, which induce sleep.\" Is that an explanation? It's a promissory note. If the receptors-induce-sleep step ever gets cashed out in ion channels, membrane potentials, and signaling cascades, you've got a real explanation. If not, you've renamed the mystery."
