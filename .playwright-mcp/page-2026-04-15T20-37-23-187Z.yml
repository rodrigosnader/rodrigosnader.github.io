        - text: "Four bars for the amplitudes of the four joint states |00⟩, |01⟩, |10⟩, |11⟩. The sign of each bar is shown by direction (up = positive, down = negative). Start from |00⟩, press H on q₁, then CNOT. The result is an entangled state: weight on |00⟩ and |11⟩, nothing in between."
    - paragraph [ref=e87]:
      - text: The two qubits are now
      - emphasis [ref=e88]: entangled
      - text: . Neither of them has its own probability distribution anymore. They have a joint one, and the joint one contains only two possible outcomes. If you measure either qubit and it comes back 0, the other is now certainly 0. If it comes back 1, the other is certainly 1. You cannot describe this situation as two independent random bits — the pattern you get when you repeat the experiment is impossible for independent bits to reproduce.
    - heading "Why entanglement is not just correlation" [level=2] [ref=e89]
    - paragraph [ref=e90]: "The first time you hear this story, the natural thing to say is: \"so the two qubits are perfectly correlated, fine, big deal.\" Correlation is a word we already have, and it seems to describe the same thing."
    - paragraph [ref=e91]:
      - text: "It doesn't. Correlation is a statement about many runs of an experiment:"
      - emphasis [ref=e92]: on average
      - text: ", the two bits come back the same. Entanglement is a statement about"
      - emphasis [ref=e93]: one shared state
      - text: ". Classically, if two bits are perfectly correlated, there's always a ground truth somewhere — a coin was flipped, both bits were set to the result, you just hadn't peeked yet. Entangled qubits have no ground truth until the measurement happens. The correlation isn't hiding a secret; there is no secret. This is what Bell's inequalities, tested in the 1970s and 80s, show: no"
      - emphasis [ref=e94]: local
      - text: hidden-variable theory (one where each particle carries its answer in its pocket) can reproduce the statistics you get from entangled particles. Whatever is going on, it isn't bookkeeping you could have done classically.
    - heading "Why all of this has to be reversible" [level=2] [ref=e95]
    - paragraph [ref=e96]:
      - text: There's one detail we snuck past that matters. Every quantum gate is
      - emphasis [ref=e97]: reversible
      - text: ". Whatever X does, X undoes if you apply it again. Same for H. Same for CNOT. It's forced by the physics: Schrödinger evolution is unitary, and unitary operations are rotation-like — every one has an inverse."
    - paragraph [ref=e98]: Classical logic doesn't have this property. An AND gate takes two inputs and produces one output; it destroys information. From the output, you cannot recover what went in. This is why erasing information has a thermodynamic cost at all — Landauer's principle puts a floor under the heat it takes to destroy a bit, and classical circuits destroy bits constantly.
    - paragraph [ref=e99]:
      - text: "Quantum gates never erase anything. Every operation is a rotation in some abstract space, and every rotation has an inverse. That's why interference is even possible: the amplitudes are being"
      - emphasis [ref=e100]: turned
      - text: ", not cut."
    - heading "What you're actually buying" [level=2] [ref=e101]
    - paragraph [ref=e102]:
      - text: Because amplitudes can cancel, you can design quantum circuits that
      - emphasis [ref=e103]: steer
      - text: wrong answers toward zero and right answers toward one. That's the trick behind Shor's factoring algorithm and Grover's search. They don't "try everything at once" — that framing skips the whole point. They engineer an interference pattern where the non-solution amplitudes destructively cancel and the solution amplitudes reinforce. After enough gate operations, the probability mass ends up concentrated on the right answer. You measure, and there it is.
    - paragraph [ref=e104]: A classical computer can't do this — not because it's slower, but because it doesn't have the right raw materials. Probabilities don't cancel. Classical logic destroys information. A deterministic gate can't hold a superposition long enough to interfere with itself.
    - paragraph [ref=e105]: That's the gap. Quantum gates aren't a speed upgrade. They're a different operation on a different kind of state, and the difference lives at the level of amplitudes — the layer sitting underneath every probability you measure.
