  - article [ref=e15]:
    - generic [ref=e16]:
      - heading "Neurons that keep living between words" [level=1] [ref=e17]
      - paragraph [ref=e18]:
        - time [ref=e19]: 2026 · Apr 12
        - text: · 11 min read · AI
    - paragraph [ref=e20]:
      - text: "Spiking neural networks look, on the surface, like a slightly more biological version of the nets you already know. A neuron sums up its inputs, hits a threshold, and fires. If that sounds suspiciously like a ReLU unit with extra steps, you're not the first person to think so. I spent an afternoon trying to figure out what was actually different, cycling through three or four explanations that all felt like they were hiding the interesting part — and the answer turned out to be one word the usual treatments bury in paragraph six: the"
      - emphasis [ref=e21]: leak
      - text: .
    - paragraph [ref=e22]:
      - text: A spiking neuron has an internal state — the
      - emphasis [ref=e23]: membrane potential
      - text: — that doesn't just sit there waiting for the next input. It bleeds. At every instant, no matter what, some fraction of it drains away. You can't turn this off. You can't train it out. It's not a choice the network makes; it's a property of the neuron itself. And that single fact is what separates spiking networks from every other neural architecture on earth, including the ones with explicit memory.
    - complementary [ref=e24]: LSTMs and Transformers also have state that persists over time. The difference, as we'll see, is that their state only changes when the network decides to change it. A spiking neuron's state is always bleeding, whether the network likes it or not. That's why the leak matters so much.
    - paragraph
    - paragraph [ref=e25]: Not the spikes. Not the timing. Not the sparsity. The leak.
    - heading "The perceptron is almost the right picture" [level=2] [ref=e26]:
      - text: The perceptron is
      - emphasis [ref=e27]: almost
      - text: the right picture
    - paragraph [ref=e28]:
      - text: "A perceptron takes a bunch of numbers, multiplies each one by a weight, sums them, and passes the total through an activation function. If the total is big enough, the activation wakes up. Otherwise it stays quiet. A spiking neuron does, roughly, the same thing: it sums its inputs, and if the sum crosses a threshold, it fires a"
      - emphasis [ref=e29]: spike
      - text: . From thirty feet away, the two are cousins.
    - paragraph [ref=e30]: Walk five feet closer and they start to look different. The perceptron takes a single snapshot of the inputs, computes an answer, and forgets. The next time you call it, it starts fresh. The spiking neuron holds its state between calls. Inputs that arrived a millisecond ago are still sitting inside it. So when a new input arrives, it adds to whatever was already there.
    - paragraph [ref=e31]: "\"Ah,\" you say, \"so a spiking neuron has memory.\" Yes. But that's not the distinction either, because LSTMs have memory, and Transformers build explicit attention over the past, and RNNs were doing this thirty years ago. Every architecture that processes a sequence has some notion of state. If that were all spiking networks offered, they'd be an interesting biological footnote and nothing more."
    - paragraph [ref=e32]:
      - text: The thing that makes them different is what happens to the state
      - emphasis [ref=e33]: when nothing is happening
      - text: .
    - heading "Walking through a sentence, slowly" [level=2] [ref=e34]
    - paragraph [ref=e35]:
      - text: Let's make this concrete. Take the sentence
      - emphasis [ref=e36]: the movie was good
      - text: . Four words. We'll pretend each word is a pulse into a single spiking neuron, with its own strength, and we'll walk through the neuron's membrane potential — call it P — one word at a time.
    - paragraph [ref=e37]: P starts at 0. The threshold, above which the neuron fires, is 0.8. The leak is 10% per tick, meaning P loses 10% of itself every time unit that passes without input.
    - list [ref=e38]:
      - listitem [ref=e39]:
        - text: –
        - emphasis [ref=e40]: "\"the\""
        - text: arrives and pushes 0.2 into the neuron. P is now 0.20.
      - listitem [ref=e41]: – Tick. Tick. Tick. During the gap, P leaks down to 0.17.
      - listitem [ref=e42]:
        - text: –
        - emphasis [ref=e43]: "\"movie\""
        - text: arrives and pushes 0.30. P jumps to 0.47.
      - listitem [ref=e44]: – Tick. Tick. Tick. Leak. P is at 0.42.
      - listitem [ref=e45]:
        - text: –
        - emphasis [ref=e46]: "\"was\""
        - text: arrives and pushes 0.10. P is at 0.52.
      - listitem [ref=e47]: – Tick. Tick. Tick. P is at 0.47.
      - listitem [ref=e48]:
        - text: –
        - emphasis [ref=e49]: "\"good\""
        - text: arrives and pushes 0.35. P jumps to 0.82.
      - listitem [ref=e50]: – 0.82 is above 0.80. The neuron fires a spike. P resets to 0.
    - paragraph [ref=e51]:
      - text: Now look at where the perceptron and the spiking neuron part ways. A perceptron fed those same four numbers would sum them — 0.20 + 0.30 + 0.10 + 0.35 = 0.95 — and fire, because 0.95 crosses any reasonable threshold. But the perceptron would fire no matter
      - emphasis [ref=e52]: when
      - text: "the inputs arrived. A single word on Tuesday and another on Friday and a third in a year: if you sum them at the end, you get 0.95 either way. The perceptron has no way to know the gap mattered."
    - paragraph [ref=e53]:
      - text: The spiking neuron absolutely knows the gap mattered. Stretch the pauses between words a bit longer and P would have leaked further each time — maybe down to 0.35 by the time
      - emphasis [ref=e54]: good
      - text: arrived, then to 0.70, and the neuron would not have fired. The sentence would have landed under threshold. Not because the words were weaker, but because the neuron had forgotten them.
    - paragraph [ref=e55]: That involuntary forgetting is the whole trick.
