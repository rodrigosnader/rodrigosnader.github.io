    - heading "Why this isn't just \"LSTM with biology\"" [level=2] [ref=e69]
    - paragraph [ref=e70]: An LSTM has internal state too. So does a Transformer (in a weirder sense, by stacking up a context window's worth of activations). You'd think that would already cover everything a spiking neuron is doing. It doesn't, and the reason is worth dwelling on.
    - paragraph [ref=e71]: The state of an LSTM cell only changes when the network decides it should change. There's a "forget gate" and an "input gate" and their values are learned — they're parameters. If the network learns to keep the state, it keeps it. If it learns to drop it, it drops it. Either way, the changing is a function of the weights, and the weights are under the network's control.
    - paragraph [ref=e72]:
      - text: A spiking neuron has no equivalent. Its state decays
      - emphasis [ref=e73]: regardless of what the weights say
      - text: . The leak is not a parameter. It's a constant of the neuron's physics. You can tune it, but you can't decide, on a per-input basis, to suspend it. The forgetting is always on.
    - paragraph [ref=e74]: "This sounds like a limitation and it mostly is, but it's also what gives spiking networks their computational flavor. Because the forgetting is always on, \"inputs that arrive close in time\" and \"inputs that arrive far apart in time\" are not interchangeable. They produce fundamentally different downstream states. The neuron is a natural coincidence detector: two inputs that arrive within the leak window reinforce each other; two inputs that arrive outside it don't."
    - paragraph [ref=e75]: That's how the brain locates sounds, by the way. A sound reaches your left ear a few microseconds before your right ear, and somewhere in your brainstem there's a neuron whose leak window is tuned to exactly that delay. If both spikes arrive within the window, the neuron fires; if not, it doesn't. Timing encodes space. None of this works without an involuntary leak.
    - heading "So how does a spiking network learn?" [level=2] [ref=e76]
    - paragraph [ref=e77]: This is the awkward part. Biological plausibility is great, but if your network can't learn, it's a very pretty paperweight.
    - paragraph [ref=e78]:
      - text: There are two real answers, and they're both compromises. The first is
      - emphasis [ref=e79]: spike-timing-dependent plasticity
      - text: ", or STDP: a local rule that strengthens a connection when neuron A fires shortly before neuron B, and weakens it when A fires shortly after B. It's biologically grounded, requires no backprop, and works beautifully in small networks. It also hits a wall in large ones, because nothing in the local rule tells a neuron whether its actions, way down in some deep layer, contributed to the network's final output. This is the"
      - emphasis [ref=e80]: credit assignment problem
      - text: ", and it's open."
    - paragraph [ref=e81]:
      - text: The second answer is to fake it. Most practical spiking networks today use a trick called
      - emphasis [ref=e82]: surrogate gradients
      - text: ": during forward pass the spikes are the usual binary 0/1 events, but during backward pass the network pretends the spike function is a smooth differentiable curve and runs backprop as usual. This is a mathematical lie that happens to work in practice. It's what the PyTorch-style libraries do. And it means that, from an engineering standpoint, the \"spiking\" part of a spiking network ends up being an inference-time property, while training is conventional."
    - paragraph [ref=e83]: Neither answer is satisfying. STDP is biologically right and doesn't scale. Surrogate gradients scale and aren't biological. Whichever one you pick, you're compromising on exactly the thing that drew you in.
    - heading "When spiking networks actually win" [level=2] [ref=e84]
    - paragraph [ref=e85]: Here's the honest answer to "are SNNs hype?" — it depends entirely on whether you can answer yes to two questions.
    - list [ref=e86]:
      - listitem [ref=e87]: Is the input naturally sparse and event-driven? (Audio from a microphone, yes. Visual data from an event camera, yes. Text, no. Images, no.)
      - listitem [ref=e88]: Do you have purpose-built hardware to run it on? (Intel Loihi, IBM TrueNorth, SpiNNaker, yes. A GPU, not really.)
    - paragraph [ref=e89]: On conventional hardware — a CPU or GPU — an SNN is slower than an equivalent non-spiking network. The simulation has to step through time, and every neuron has to be checked at every tick whether it's silent or not. The theoretical advantage of "sparse neurons cost nothing" only shows up on neuromorphic chips, which are literally built out of analog circuits that don't burn energy when a neuron is quiet. On those chips, a network processing sparse input can run at a fraction of the power of a GPU doing the same job. That is real, and it matters, and it's why robotics labs and edge-sensor companies actually care about SNNs.
    - paragraph [ref=e90]:
      - text: For language modeling — where the input is dense, symbolic, and not even
      - emphasis [ref=e91]: temporal
      - text: in the way an audio stream is — spiking networks are basically hype. The leak, the main thing that makes an SNN an SNN, actively gets in the way of long-range reasoning. Transformers win there, convincingly, and nothing in the SNN literature has changed that.
    - generic [ref=e92]:
      - generic [ref=e93]: Honest tension
      - paragraph [ref=e94]: It is very tempting to read "biology uses spikes" and conclude "therefore deep learning must eventually use spikes." I don't buy it. Biology uses spikes because wetware evolved in continuous time and couldn't afford clocked digital state — spikes are what you get when you build a neuron out of ion channels, and you have to decode them the best you can. Our models are not constrained by ion channels. Borrowing the spike representation might be helpful for some workloads, but it isn't a law.
    - heading "A pair of neurons, side by side" [level=2] [ref=e95]
    - paragraph [ref=e96]: The second visualization makes the gap between the two styles blatantly visible. Same input stream. One neuron is a leaky integrate-and-fire; the other is a ReLU-style perceptron that just sums its last input against a threshold. Watch how differently they respond to gaps in the input.
    - figure [ref=e97]:
      - generic [ref=e99]:
        - generic [ref=e100]:
          - generic [ref=e101]: input gap — 3 ticks
          - slider "input gap — 3 ticks" [ref=e102] [cursor=pointer]: "3"
        - button "Pause" [ref=e103] [cursor=pointer]
      - generic [ref=e104]:
        - generic [ref=e105]: Fig 2
        - text: "Top: a leaky spiking neuron. Bottom: a stateless activation (summation with immediate decay to zero between inputs). Both receive the same stream of pulses. Stretch the gap and watch the spiking neuron miss its rhythm, while the stateless unit doesn't know the difference."
    - paragraph [ref=e106]: Notice what happens at large gaps. The spiking neuron fires less often, because its walkup gets reset by the leak between pulses. The stateless unit fires at exactly the same rate as at small gaps, because it has no concept of time passing. That is the entire observable difference between the two architectures, and it is both the reason spiking networks can be good at temporal coincidence detection and the reason they aren't going to replace your favorite language model any time soon.
    - heading "What this all adds up to" [level=2] [ref=e107]
    - paragraph [ref=e108]: Spiking neural networks are not a faster version of Transformers, the way quantum computers aren't a faster version of classical ones. They're a different thing. They trade continuous, involuntary forgetting for native sensitivity to the passage of time. On the right hardware, handling the right kind of input, that trade pays off handsomely — it's how you get real-time audio processing on a button battery, or robot control loops that don't need a GPU.
    - paragraph [ref=e109]: On everything else — dense data, symbolic reasoning, anything that doesn't care whether two events were a millisecond or a minute apart — they lose, and they lose to architectures built for exactly that. Saying it out loud is not disloyalty to the biological inspiration. It's what you have to say if you actually want to know when spiking networks are the right tool and when they are a paperweight with ion channels painted on.
    - paragraph [ref=e110]: "The cleanest one-sentence summary I have left is this: if you've ever tried to understand why a Transformer feels so different from a brain, the leak is most of the answer. Not the only part, but the part that most people leave out."
