        - text: Pick a starting word and follow Wikipedia's first-link chain to Philosophy. About 97% of all articles get there. Paths traced in April 2026 — they shift as Wikipedia is edited. Try your own at
        - link "pathtophilosophy.com" [ref=e63] [cursor=pointer]:
