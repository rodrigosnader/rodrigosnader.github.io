        - text: .
    - paragraph [ref=e64]: You run out of budget. The chain is solid so far, but the next step would take you into a different field entirely. That's fine — rigor isn't about reaching the bottom of all knowledge. It's about knowing where your chain stops and that the link you stopped at holds weight.
    - paragraph [ref=e65]: Say you loop. You reach a claim you already passed through, and the explanation is broken. This is the hardest case to catch — the circle fits comfortably in your head, and the return to the starting point feels like arriving at an answer. Writing the chain down is what makes it visible. Linear text is harder to fool than a train of thought.
    - heading "The illusion of explanatory depth" [level=2] [ref=e66]
    - paragraph [ref=e67]: "There's a reason circular explanations feel fine in your head. Psychologists call it the illusion of explanatory depth: you think you understand something until you're asked to actually explain it. Try defining what a toy is without mentioning play. An object that... children interact with? A thing designed to... entertain? Each attempt either smuggles in \"play\" under a different word or says nothing at all. The concept felt solid until the constraint revealed it was resting on a single dependency you hadn't noticed."
    - paragraph [ref=e68]: I think this applies to more than anyone is comfortable admitting. You "know" what a neural network does until someone asks what one neuron does and why the multiplication is there. The first layer of understanding is a label, and the label rests on familiarity, not on mechanism.
    - paragraph [ref=e69]: You can't ground everything. At some point you take a concept as primitive and stop pushing. A physicist grounds in fields. A chemist stops at the atom. A cook stops at "salt." None of this is wrong. The discipline isn't "always go deeper" — it's knowing where you stopped, and being honest that you stopped there.
    - heading "One check" [level=2] [ref=e70]
    - paragraph [ref=e71]: "I've mostly been talking about other people's explanations, but the most useful version of this is turned inward. Next time you're writing or teaching or trying to argue for something, pause and trace: where does this bottom out?"
    - paragraph [ref=e72]: Every argument has a floor. A good one knows where its floor is.
