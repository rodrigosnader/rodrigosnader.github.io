  - article [ref=e16]:
    - generic [ref=e17]:
      - heading "Explanations that don't eat their tail" [level=1] [ref=e18]
      - paragraph [ref=e19]:
        - time [ref=e20]: 2026 · Apr 16
        - text: · 6 min read · Essay
    - blockquote [ref=e21]:
      - paragraph [ref=e22]: "\"What's a radius?\" \"Half the diameter.\" \"And a diameter?\" \"Twice the radius.\""
    - paragraph [ref=e23]: Both sentences are true. Together they explain nothing. If you didn't know what a radius was before reading them, you still don't. Each definition props up the other; neither one touches the ground.
    - paragraph [ref=e24]: "I keep coming back to this pattern. Something that sounds like an explanation, passes a casual reading, and collapses under one round of \"but why?\" The shape of the failure is always the same: a loop, disguised as a chain."
    - heading "Levels mean dependency" [level=2] [ref=e25]
    - paragraph [ref=e26]: "When we say a concept is \"lower-level\" than another, we mean one thing: you need it to make sense of the other. If you need B to understand A, then B is lower than A. That's all."
    - paragraph [ref=e27]: So what sits one level below radius and diameter? The center of the circle. A circle is all the points equidistant from a center. The radius is the distance from center to edge. The diameter is the distance straight across, through the center. Neither word needs the other; both need the center. And "center," "distance," "edge" — those are words you already have. You don't need them explained. That's the floor.
    - paragraph [ref=e28]: "Each layer rests on concepts that require less from you — concepts closer to things you'd just nod at. That's what \"lower\" means here: not simpler, not smaller, just closer to a foundation you're already standing on."
    - paragraph [ref=e29]: Ask why a program crashed and "because there was a bug" gives you nothing — it's the crash restated with a different word. "The function received null because the API returned an empty response and nothing checked for that" has steps, each one sitting on the previous. The first is a loop. The second is a chain.
    - paragraph [ref=e30]: This is easier to see in code than in prose. A function that calls itself without a base case blows the stack — the "compiler" refuses. Natural language has no such enforcement. Circular explanations compile just fine in English, which is why careful writers do the check by hand.
    - heading "The dormitive virtue" [level=2] [ref=e31]
    - paragraph [ref=e32]:
      - link "Molière" [ref=e33] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/Le_Malade_imaginaire
      - text: staged the canonical version of this trap in 1673. In
      - emphasis [ref=e34]: Le Malade imaginaire
      - text: ", a medical candidate is asked why opium makes people sleep. He answers, in impressive Latin, that opium possesses a"
      - emphasis [ref=e35]: virtus dormitiva
      - text: — a "dormitive virtue" — whose nature is to cause the senses to slumber.
    - blockquote [ref=e36]:
      - paragraph [ref=e37]: "Translated: opium makes you sleepy because it has a sleepiness-making quality. The Latin dresses up the phenomenon as a cause."
    - paragraph [ref=e38]: This matters because the trick scales. Replace "dormitive virtue" with any sufficiently technical-sounding mechanism, and the same empty move passes inspection. "Opium triggers the opioid receptors, which induce sleep." Is that an explanation? It depends on whether "opioid receptors" unpacks into something lower — ion channels, membrane potentials, signaling cascades. If it does, you've added a real step to the chain. If it's just a fancier label for "the thing that causes sleepiness," the circle got wider but didn't break.
