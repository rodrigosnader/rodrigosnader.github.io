        - text: Switch between four dependency graphs. If the arrows form a loop, the explanation is circular — it never grounds out. If they reach primitive nodes (things you'd accept without further explanation), the explanation is rigorous. The first two are broken. The last two actually bottom out.
    - heading "The why-test" [level=2] [ref=e48]
    - paragraph [ref=e49]:
      - text: There's a way to catch this. Take any explanation and keep asking
      - emphasis [ref=e50]: why
      - text: ", the way a child does before learning when to stop. Each answer is a new claim; ask why again. One of three things happens."
    - paragraph [ref=e51]:
      - text: "You ground out. You reach something that doesn't need further definition — a concept close enough to bedrock that you stop naturally. There's a beautiful demonstration of this on Wikipedia: pick any article, click the first link in the body text, and keep going. About 97% of articles eventually land on"
      - emphasis [ref=e52]: Philosophy
      - text: . The definitions keep chaining into lower-level concepts until there's nowhere left to go but the study of thought itself.
