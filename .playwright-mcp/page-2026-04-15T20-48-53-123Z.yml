  - article [ref=e15]:
    - generic [ref=e16]:
      - heading "What if time is just a direction?" [level=1] [ref=e17]
      - paragraph [ref=e18]:
        - time [ref=e19]: 2026 · Apr 15
        - text: · 10 min read · Physics
    - paragraph [ref=e20]: In 1814, Pierre-Simon Laplace made one of the most famous bets in the history of science. Give me, he wrote, the exact position and velocity of every particle in the universe, and I will hand you back the future. The whole of it. Not an approximation — everything that will ever happen.
    - paragraph [ref=e21]:
      - text: The claim has been argued over by Newton's students, modern philosophers of physics, anyone who's worried about determinism and free will. I want to look at the throwaway word in the middle of Laplace's sentence — the word
      - emphasis [ref=e22]: velocity
      - text: — and what happens when you take it seriously.
    - paragraph [ref=e23]: The moment you put time on the same footing as space, which is what physics spent the twentieth century pulling it toward without ever quite getting there, velocity stops being a property of a particle. It becomes an orientation. And Laplace's demand turns out to be a little more than a demand for coordinates.
    - heading "The block universe, in one picture" [level=2] [ref=e24]
    - paragraph [ref=e25]:
      - text: You can stop thinking of time as a thing that flows and start thinking of it as another axis, like the three spatial ones. Events don't "happen" in this picture — they sit at particular coordinates. A particle doesn't "move"; it occupies a one-dimensional curve, called a
      - emphasis [ref=e26]: worldline
      - text: ", that cuts through the block of spacetime from earlier to later."
    - paragraph [ref=e27]: "This is the block universe view, and it's a perfectly consistent way to describe the world. It has a strange consequence that most people glide past: if the universe is a block, then the future is already in it. Not in the sense that we can see it, or that it's fated, but in the geometric sense — you can point at spacetime coordinates that belong to next Thursday the same way you can point at the back of your kitchen. Both exist in the same diagram. The only reason we experience one as memory and the other as anticipation is that our brains move along worldlines in a particular direction. The block does not."
    - paragraph [ref=e28]:
      - text: Once you accept that picture, Laplace's demon starts to look different. The demon was supposed to
      - emphasis [ref=e29]: predict
      - text: — to take a snapshot and crank it forward. But in a block universe there's nothing to crank. The future is already drawn. The demon isn't predicting; it's
      - emphasis [ref=e30]: reading
      - text: a shape that already exists.
    - figure [ref=e31]:
      - generic [ref=e33]:
        - generic [ref=e34]:
          - generic [ref=e35]: the present — 0.50
          - slider "the present — 0.50" [ref=e36] [cursor=pointer]: "0.5"
        - button "Add worldline" [ref=e37] [cursor=pointer]
        - button "Reset" [ref=e38] [cursor=pointer]
      - generic [ref=e39]:
        - generic [ref=e40]: Fig 1
        - text: A block of spacetime. The horizontal axis is space (one dimension of it, for drawing). The vertical axis is time, running up. Each curve is a worldline — a particle's entire history from earlier to later. The bright horizontal line is "the present". Drag the slider and watch the present sweep through the block; the worldlines intersect it at different points, and those intersections are what you'd call "where the particles are right now". In a block universe, the motion of the particles is the same block, seen from a moving slice.
    - paragraph [ref=e41]: Scrub the present slice from bottom to top. The dots at the intersection look exactly like an animation of particles moving — because that's what "particles moving" is. It's the intersection of a sliding present with a static set of worldlines. The block itself doesn't change. Your reading of it does.
    - heading "And then velocity disappears" [level=2] [ref=e42]
    - paragraph [ref=e43]:
      - text: This is where Laplace's picture gets uncomfortable. In the block universe there is no such thing as
      - emphasis [ref=e44]: velocity
      - text: ", at least not in the sense of a rate of change over time. Rate of change over time assumes time is a flow. In the block, time is an axis. The analog of velocity is the"
      - emphasis [ref=e45]: angle
      - text: of the worldline — its orientation. A worldline that tilts gently to the right is a particle moving slowly rightward. A worldline that tilts sharply is one moving fast. A vertical worldline is a particle at rest.
    - paragraph [ref=e46]: The reframe has a consequence Laplace's original formulation hides. Take a horizontal slice — a snapshot of the present — and you get all the particle positions, but you've thrown out all the worldlines' tangents. You don't know, from a single slice, which way any of the worldlines were tilted. The particles have positions. They don't have futures.
    - paragraph [ref=e47]:
      - text: Which is why Laplace asked for positions
      - emphasis [ref=e48]: and
      - text: velocities. He wasn't being pedantic; he was silently smuggling in the tangent information that a snapshot alone doesn't carry. Without it, you can't extend the worldline in either direction.
    - paragraph [ref=e49]: "That's what \"predicting the future\" means in this picture: you're handed a slice with extra data attached at every point, and you use that data to walk the worldlines forward. The demon doesn't compute. It integrates. It follows the tangents."
    - heading "The detail that bothers me" [level=2] [ref=e50]
    - paragraph [ref=e51]:
      - text: The tangent isn't a position in space. It lives in a different kind of space — the space of directions at that point. In classical mechanics we hide this by writing down three numbers and calling them "velocity components," but those three numbers are coordinates in a second space attached to the first. Mathematicians call the whole thing a
      - emphasis [ref=e52]: tangent bundle
      - text: ", and it doubles the dimensionality of your description. To specify a particle, you need six numbers, not three: three for position and three for the orientation of its worldline."
    - paragraph [ref=e53]: If the tangent really is a different kind of coordinate, why do we keep pretending it isn't? Why do we write "position plus velocity" as if those are two different things, instead of admitting that our state space is twice as big as our physical space and moving on?
    - paragraph [ref=e54]:
      - text: And there's a sharper version of the question. If orientation is what makes a worldline a worldline, then specifying a particle's state is really specifying a
      - emphasis [ref=e55]: point plus a direction
      - text: . But a point plus a direction is itself a point in a bigger space — one with more dimensions than the one you started with. What if that bigger space is the real one, and our four-dimensional spacetime is just the projection of it onto a smaller frame?
    - figure [ref=e56]:
      - generic [ref=e59]:
        - generic [ref=e60]: tangent angle — 0°
        - slider "tangent angle — 0°" [ref=e61] [cursor=pointer]: "0"
      - generic [ref=e62]:
        - generic [ref=e63]: Fig 2
        - text: A single point in spacetime (the dot). The slider rotates the tangent — the direction of the worldline passing through that point. Every angle is a different future and a different past. A snapshot of the position alone gives you just the dot. You need the angle too, and the angle lives in a space the dot doesn't.
    - heading "A quiet suggestion" [level=2] [ref=e64]
    - paragraph [ref=e65]:
      - text: I'm not a physicist. Something has always bothered me about how physicists treat time, though, and I only recently caught what it was. In the equations we write, time is
      - emphasis [ref=e66]: almost
      - text: a spatial dimension. But not quite.
    - paragraph [ref=e67]: "In the equation for distance in spacetime, the time coordinate gets a minus sign where the space coordinates get a plus. That tiny sign is doing enormous work, and nobody knows why it's there. Time derivatives and space derivatives don't behave the same way either — look at the wave equation, or Schrödinger's equation, and the asymmetry is everywhere. And then there's the arrow: entropy runs one way, not the other (though see the caveat below)."
    - paragraph [ref=e68]:
      - text: If time were just another spatial direction, those asymmetries would be unexpected. None of them follow from the geometry alone; they all have to be put in by hand. The standard response is to say "well, time just
      - emphasis [ref=e69]: is
      - text: different from space, we don't know why, get used to it."
    - paragraph [ref=e70]: "There's a second response I've seen physicists float in different forms without ever quite committing to: the asymmetries we attribute to time might be the shadow of something we've flattened. Maybe what we call \"time\" isn't one dimension but a compound — a coordinate paired with a constraint, or two coordinates whose projection into a single real number is what we observe. Under that reading, the minus sign in the metric and the asymmetric derivatives stop being brute facts and start being a hint about a richer geometry."
    - paragraph [ref=e71]:
      - text: "I don't know if this is true. The honest place to land is not \"and therefore time is two-dimensional\" but something more careful: the ways our equations treat time as"
      - emphasis [ref=e72]: almost
      - text: spatial are consistent and suggestive enough that some people have looked at them and gone "hmm." That's the rumor, and you're allowed to hold it lightly.
    - generic [ref=e73]:
      - generic [ref=e74]: Honest tension
      - paragraph [ref=e75]: The arrow-of-time piece above is the softest of the three. Entropy increases because of the initial conditions of the universe, not because of anything in the equations themselves. If you reversed all the momenta in the universe, the equations would run backward without complaint. The arrow isn't in the physics; it's in the initial state. The minus sign and the asymmetric derivatives are firmer evidence that time is doing something other than "being a spatial dimension in disguise."
    - heading "Back to the demon" [level=2] [ref=e76]
    - paragraph [ref=e77]:
      - text: If the universe is a block, the future is already drawn, and "predicting" is really just reading. The demon doesn't peer forward; it scans a shape that was there all along. That's a lot less dramatic than it sounds in 1814. It also makes the free-will worry kind of silly, because the worry assumed the demon could take a present state and
      - emphasis [ref=e78]: determine
      - text: a future — but the block universe says the present state sits next to the future in the same geometric object. Nothing
      - emphasis [ref=e79]: happens
      - text: ; everything coexists in a particular order.
    - paragraph [ref=e80]: If the block is richer than four dimensions — because tangents live in a bigger space, or because time isn't really one coordinate — then even the reading is harder than Laplace thought. You can't stand at a slice and infer the worldlines from positions alone. You need the tangents. And the tangents may themselves be projections from an even bigger geometry we haven't figured out how to draw yet.
    - paragraph [ref=e81]:
      - text: Laplace's promise was
      - emphasis [ref=e82]: really
      - text: asking for the complete shape of reality, with "where everything is" as a single slice of it. Once you see that, the demon stops looking like a sci-fi oracle and starts looking like a physicist's very specific fantasy about how much information the universe is willing to hand over in a single snapshot.
    - heading "What survives" [level=2] [ref=e83]
    - paragraph [ref=e84]: What I actually believe, such as it is. I find the block universe the cleanest of the usual framings, and I think popular science underweights it. Velocity-as-orientation is the move that makes the whole picture hang together, and once you make it, the idea that "prediction" is a separate act from "description" evaporates. And the weirdness of time in our equations is not necessarily a quirk we have to live with; it's the kind of thing that, historically, has turned out to be a clue.
    - paragraph [ref=e85]: Is the clue pointing at extra time dimensions, a tangent bundle we've been flattening, or something none of us have imagined? I don't know. But I'm fairly confident the right question isn't "is the universe deterministic?" — Laplace's framing — but "what shape is the universe, and how much of it can you read from any single slice?" Whatever answer we get, the demon will still be in the corner of the room, holding out its hand for information.
