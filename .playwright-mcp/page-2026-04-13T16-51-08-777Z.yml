  - article [ref=e16]:
    - generic [ref=e17]:
      - heading "Explanations that don't eat their tail" [level=1] [ref=e18]
      - paragraph [ref=e19]:
        - time [ref=e20]: 2026 · Apr 12
        - text: · 7 min read · Essay
    - paragraph [ref=e21]: Let me try to explain something.
    - paragraph [ref=e22]: A radius is half the length of a diameter.
    - paragraph [ref=e23]: And a diameter? A diameter is twice the length of a radius.
    - paragraph [ref=e24]: Done. You should now know what a radius is.
    - paragraph [ref=e25]: "Except you don't, and the reason is worth half an hour. The two sentences above form what I'd like to call a perfect explanation in the Escher sense: they are mutually consistent, each one is individually true, and together they explain nothing. If you didn't know what a radius was before reading them, you still don't. I can keep talking — I can tell you that circumference equals π times diameter, and that π is the ratio of circumference to diameter — but every sentence I add is going to rely on a word that only makes sense in terms of another word I'm also defining. The whole structure floats, held up by its own hair."
    - paragraph [ref=e26]: This is the kind of thing that happens when an explanation eats its own tail. It's one of the most common failures in writing, teaching, thinking, and debugging, and once you learn to spot it you start to notice how much of the world's "explaining" is actually just this. So let's pull it apart.
    - heading "Concepts are dependencies, not sizes" [level=2] [ref=e27]
    - paragraph [ref=e28]:
      - text: The first thing worth saying is that "higher-level" and "lower-level" concepts are not about grandeur. They're about dependency. A concept B is
      - emphasis [ref=e29]: lower
      - text: than concept A if you need B to make sense of A. If I want to explain what a molecule is, I'd better have "atom" already available, because a molecule is something atoms do. If I want to explain what an atom is, I'd better have "electron" and "nucleus" available, because that's what an atom is made of. The dependency goes one way. You ground up, not sideways.
    - paragraph [ref=e30]: The radius and diameter sit at the same level. Neither depends on the other. You can define both in terms of a simpler idea — "a circle is the set of all points equidistant from a center; the radius is that distance, the diameter is twice that distance" — and now the dependency graph goes down one step to "distance" and "point" and "center", which are simpler concepts that most readers will accept without further definition. That is how explanations are supposed to work. Each layer earns its keep by sitting on something cheaper underneath.
    - paragraph [ref=e31]: If your explanation can't do this — if it's a graph of concepts that all depend on each other and never reach anything primitive — it's broken. Not wrong, exactly. Broken.
    - heading "The dormitive virtue" [level=2] [ref=e32]
    - paragraph [ref=e33]:
      - text: "Molière had a line about this in the seventeenth century. A would-be doctor is being examined on what makes opium put people to sleep. He answers, in impressive Latin:"
      - emphasis [ref=e34]: because it possesses a dormitive virtue, whose nature is to cause the senses to slumber
      - text: . Which, translated, is "opium makes you sleepy because it has a sleepiness-making quality." He passes the exam. He should not have.
    - paragraph [ref=e35]: "\"Dormitive virtue\" is a label stuck on the phenomenon it was supposed to explain. The phenomenon is \"opium makes you sleepy.\" The explanation is \"opium has a sleepiness-making thing in it.\" If you ask what the sleepiness-making thing is, the only answer the explanation can give is \"it's the thing that makes opium make you sleepy,\" which sends you back to where you started. The explanation is a loop, and the loop has one step."
    - paragraph [ref=e36]: The reason this matters is that the dormitive-virtue trick is almost undetectable when you do it with modern vocabulary. Replace "dormitive virtue" with any sufficiently impressive-sounding neurotransmitter, mechanism, or brand of theory, and the same empty move slides past most readers. "Opium triggers the opioid receptors, which induce sleep." Is that an explanation? Sort of. It pushes the question down one level — now we have to ask what the opioid receptors are and why they induce sleep — but unless those pushes ground out in something actually mechanistic (ion channels, membrane potentials, downstream signaling cascades), we're still going in circles, just with bigger vocabulary.
