      - generic [ref=e44]:
        - generic [ref=e45]: Fig 1
        - text: Click a concept and watch its dependency graph light up. If the graph grounds out in primitive nodes — things you'd accept without further explanation — the explanation is
        - emphasis [ref=e46]: rigorous
        - text: . If it loops back on itself, the cycle lights up in red, and the explanation is
        - emphasis [ref=e47]: circular
        - text: . The two bad examples really are broken. The two good ones really do bottom out.
    - heading "The why-test" [level=2] [ref=e48]
    - paragraph [ref=e49]:
      - text: Here's a practical move. Take any explanation you're unsure about, and start asking
      - emphasis [ref=e50]: why
      - text: like an irritating child. Each answer is a new claim; ask why of that one. Keep going. Eventually, one of three things happens.
    - paragraph [ref=e51]: You ground out. You reach a claim that feels primitive — a physical mechanism, a mathematical definition, a sense observation, something you don't feel the need to push further. The explanation is rigorous, at least from here down.
    - paragraph [ref=e52]:
      - text: You run out of budget. You reach a place where further questioning would require a different field of expertise, but the chain you traced so far is sound. That's fine. Rigor doesn't require you to ground in the Standard Model; it requires you to ground
      - emphasis [ref=e53]: somewhere solid
      - text: ", and acknowledge where you stopped."
    - paragraph [ref=e54]: You loop. You reach a claim you already passed through. At that point the explanation is broken, and you should know it's broken before you continue building on it.
    - paragraph [ref=e55]: "The loop case is the interesting one, because the loop is usually invisible in the moment. You don't notice you're back where you started until someone else is patient enough to trace the chain. This is why writing things down helps: linear prose forces the loop to become visible. Your head can hold a circular explanation and feel productive about it, because the circle fits inside working memory and the return-to-start feels like \"arriving at the answer.\""
    - heading "The illusion of explanatory depth" [level=2] [ref=e56]
    - paragraph [ref=e57]:
      - text: There's a name for what's happening in your head when you fall for a circular explanation you shouldn't have. Psychologists call it the
      - emphasis [ref=e58]: illusion of explanatory depth
      - text: ", and it's a robust finding. If you ask someone how confident they are that they understand how a zipper works, they'll rate themselves pretty high. Then ask them to actually explain how a zipper works, step by step, mechanism included. Their confidence plummets within about three sentences. The reason is that the self-assessment was based on a"
      - emphasis [ref=e59]: label
      - text: — "I know how zippers work" — and the label was indexed to a vague mental image, not to a working model.
    - paragraph [ref=e60]: This applies to everything. You "know" how an internal combustion engine works, until you have to actually explain what happens in the cylinder. You "know" what inflation is, until someone asks what's happening at the level of individual price-setting decisions. You "know" what a neural network does, until someone asks what one neuron does and why the multiplication is there. In every case, the first layer of understanding is held up by the label, and the label is held up by nothing. The why-test drops the label and asks for the mechanism, and the mechanism is where the honest work starts.
    - generic [ref=e61]:
      - generic [ref=e62]: Honest tension
      - paragraph [ref=e63]: You can't ground everything. At some point you have to take a concept as primitive, and different communities accept different primitives. A physicist grounds at "field" and keeps going. A chemist grounds at "atom" and stops. A cook grounds at "salt" and doesn't pretend otherwise. None of this is wrong. Rigor isn't "keep going forever" — it's "know where you stopped, and why it was reasonable to stop there."
    - heading "Top-down isn't a sin" [level=2] [ref=e64]
    - paragraph [ref=e65]:
      - text: Before I wrap up, a defense of top-down explanations, because I don't want to leave the impression that they're always bad. They aren't. Top-down is great as
      - emphasis [ref=e66]: scaffolding
      - text: . "A neural network is a function that maps inputs to outputs by stacking layers of weighted sums and nonlinearities" is a top-down sentence and it's useful — it tells you the shape of the thing before you dive into the pieces.
    - paragraph [ref=e67]:
      - text: The sin isn't top-down. The sin is top-down that
      - emphasis [ref=e68]: never
      - text: grounds out. A scaffold that stays in the air forever isn't a scaffold; it's a free-floating cathedral. Good writing uses top-down to orient the reader and then grinds through the bottom-up to actually deliver the payoff. Most textbooks do some of this. The ones that don't are the ones you still feel confused by after finishing.
    - paragraph [ref=e69]: Programming is where this discipline is easiest to see, incidentally. You can't write a function that depends on itself without eventually causing the stack to blow up. The compiler refuses. Prose has no such enforcement — circular explanations compile just fine in natural language — which is why careful writers keep doing the why-test by hand.
    - heading "One takeaway" [level=2] [ref=e70]
    - paragraph [ref=e71]:
      - text: "I've mostly been talking about reading other people's explanations, but the most useful application of this is to your own. The next time you catch yourself writing or teaching or trying to convince someone of something, pause and ask:"
      - emphasis [ref=e72]: where does this bottom out?
      - text: Every argument has a floor, and a good one knows what its floor is. A bad one has either no floor or a secret trap door in the middle that cycles back to the top.
    - paragraph [ref=e73]: You can make a lot of your thinking sharper by just doing this one check. Not on every sentence — that would be exhausting — but on any claim that seems to be doing heavy lifting. Trace it down. See if it grounds. If it does, you've got something you can actually build on. If it doesn't, you've been holding the air and calling it a building.
