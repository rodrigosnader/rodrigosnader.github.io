  - article [ref=e15]:
    - generic [ref=e16]:
      - heading "The boy and the infinite universe" [level=1] [ref=e17]
      - paragraph [ref=e18]:
        - time [ref=e19]: 2026 · Apr 15
        - text: · 7 min read · Physics
    - paragraph [ref=e20]: The boy read the sentence in a library book and it refused to mean anything.
    - paragraph [ref=e21]:
      - emphasis [ref=e22]: Every point in the universe is the center of the universe.
    - paragraph [ref=e23]: He tried, with the seriousness of someone who was nine and had time, to picture it. He couldn't. Pizzas had centers. Circles had centers. Even his grandmother's tomato garden had a center — it was the spot where the hose came out of the wall. How could every point be the center of anything?
    - paragraph [ref=e24]: So the boy did what he always did when a sentence refused to be a sentence. He asked it out loud, to the kind of voice you only hear when the room is quiet enough.
    - paragraph [ref=e25]: "\"How can every point be the center?\""
    - paragraph [ref=e26]: Something answered.
    - heading "The balloon" [level=2] [ref=e27]
    - paragraph [ref=e28]: "\"Imagine a balloon,\" said the voice. \"Draw dots on its surface. As the balloon inflates, every dot moves away from every other dot. From any dot's point of view, everything is running away from it. So every dot can claim to be the center.\""
    - paragraph [ref=e29]: The boy frowned.
    - paragraph [ref=e30]: "\"A balloon has a center, though. I know where it is. It's inside.\""
    - paragraph [ref=e31]: "\"The surface doesn't.\""
    - paragraph [ref=e32]: "\"But if I live on the surface and I walk in one direction long enough, I'll come back to where I started. The surface goes around. If the universe goes around, I should be able to walk in one direction forever and eventually see my own back.\""
    - paragraph [ref=e33]: The voice was quiet for a moment.
    - paragraph [ref=e34]: "\"That's a fair point. I forgot that part.\""
    - heading "The cake" [level=2] [ref=e35]
    - paragraph [ref=e36]: "\"Try a cake. A cake baking in the oven, with raisins scattered through the dough. As the dough rises, every raisin moves away from every other raisin. From any raisin's point of view —\""
    - paragraph [ref=e37]: "\"Cakes have middles.\""
    - paragraph [ref=e38]: "\"Well —\""
    - paragraph [ref=e39]: "\"There is a place inside the cake you can point to and say: this is the middle of the cake. And when the cake rises, the edges rise, but the middle is still the middle. You're telling me the universe is like a cake, and a cake has a middle, and therefore the universe has a middle, and I don't think that's what you meant.\""
    - paragraph [ref=e40]: The voice admitted this.
    - figure [ref=e41]:
      - generic [ref=e43]:
        - generic [ref=e44]: Fig 1
        - text: "Two analogies, neither quite right. On the left, a balloon: dots drift apart on the surface, but the surface itself is finite and curved, so walking far enough in one direction brings you back. On the right, a cake: dots drift apart in a solid, but the solid has an edge. Neither is what \"no center, no edge, infinite\" is trying to describe."
    - heading "The grid" [level=2] [ref=e45]
    - paragraph [ref=e46]: "\"Forget curved surfaces and rising dough. Imagine an infinite grid of dots. Evenly spaced. Going forever in every direction. There is no edge. There is no middle. And the distance between any two dots is increasing over time.\""
    - paragraph [ref=e47]: The boy tried to imagine it. He could make the grid stretch in his head and feel its lack of edge — but a new question arrived immediately.
    - paragraph [ref=e48]: "\"There was a Big Bang, though.\""
    - paragraph [ref=e49]: "\"Yes.\""
    - paragraph [ref=e50]: "\"Doesn't that mean the universe used to be small? Like, the size of a marble. I've seen it in textbooks.\""
    - paragraph [ref=e51]: "\"Ah.\""
    - paragraph [ref=e52]: "\"The part of the universe we can see was the size of a marble, back then. Because light hadn't had time to travel very far. But the whole universe — the whole thing — was already infinite, as far as we can tell. It didn't fit inside a marble. It was, and it still is, everywhere.\""
    - paragraph [ref=e53]: The boy held very still.
    - paragraph [ref=e54]: "\"Then what does it mean to say it was smaller?\""
    - paragraph [ref=e55]:
      - text: "\"It wasn't smaller the way a marble is smaller. It was"
      - emphasis [ref=e56]: denser
      - text: . The same points, packed closer together."
    - heading "The aha" [level=2] [ref=e57]
    - paragraph [ref=e58]: Something shifted in the boy's head, quietly, the way a lock falls open when the tumblers line up without you meaning them to.
    - paragraph [ref=e59]: The universe had never been small. It had always been infinite. What had changed was not its size — it was how far apart its pieces sat from each other. The Big Bang was not an explosion in a point. It was an explosion everywhere at once, because it wasn't really an explosion at all. It was the moment when everything started to spread out.
    - paragraph [ref=e60]: You can picture it if you let go of "size" as a meaningful word for the whole thing. Take an infinite row of dots spaced a millimeter apart. That's the universe right after the Big Bang. Now let every gap grow a little. Now a lot. Now a lot more. You still have the same infinite row of dots. You haven't added any. You haven't made the row longer, because it was already endless. You've just made the dots less crowded.
    - figure [ref=e61]:
      - generic [ref=e63]:
        - generic [ref=e64]:
          - generic [ref=e65]: expansion — 1.0×
          - slider "expansion — 1.0×" [ref=e66] [cursor=pointer]: "1"
        - button "Pick a random galaxy" [ref=e67] [cursor=pointer]
      - generic [ref=e68]:
        - generic [ref=e69]: Fig 2
        - text: "An infinite grid of galaxies, extending past every edge of the window. Drag the slider to expand the space — watch how every galaxy recedes from every other one. Click \"pick a random galaxy\" and the view re-centers on a new one. It always looks the same: every direction is running away. No galaxy is special. None is at the center, because there is no center."
    - paragraph [ref=e70]: "\"So all that stuff about the universe being the size of a marble —\""
    - paragraph [ref=e71]:
      - text: "\"Is the"
      - emphasis [ref=e72]: observable
      - text: universe. The part we can see. Light hasn't had time to reach us from further than that, and it might never. The rest goes on forever, even now."
    - paragraph [ref=e73]: "\"Forever.\""
    - paragraph [ref=e74]: "\"Forever.\""
    - paragraph [ref=e75]: The boy thought about this for a while.
    - heading "The deeper question" [level=2] [ref=e76]
    - paragraph [ref=e77]: "\"Wait,\" said the boy, slowly. \"If the universe was always infinite, and the thing that changed was how packed it was — then 'density' and 'size' aren't really two different things for the universe, are they?\""
    - paragraph [ref=e78]: The voice didn't answer right away.
    - paragraph [ref=e79]: "\"That's a good question.\""
    - paragraph [ref=e80]: "\"I mean. For a pizza, I can tell you the size of the pizza and also how thick the cheese is. Those are independent. But you just told me size is meaningless for the universe and only density counts. So maybe the universe doesn't have a size at all. Maybe it only has density, and we've been calling it 'size' because we live inside it and we want it to have one.\""
    - paragraph [ref=e81]: "\"Some physicists are playing with ideas in that neighborhood — theories where space itself isn't fundamental, but comes out of something more basic. Whether any of them ends up where you just landed, nobody knows.\""
    - paragraph [ref=e82]: "\"So I wasn't crazy.\""
    - paragraph [ref=e83]: "\"Nobody knows yet.\""
    - heading "The quiet part" [level=2] [ref=e84]
    - paragraph [ref=e85]: The boy looked up. The stars, he noticed for the first time, were not floating in anything. The "anything" was the stars. The dots were the space, and the space was the dots, and there had never been an edge, and there had never been a middle, and the Big Bang had happened right under his feet at the same moment it happened everywhere else.
    - paragraph [ref=e86]: He felt the way you feel when a room you've been standing in all your life turns out to be a different shape.
    - paragraph [ref=e87]: He didn't know what to do with it, so he did what you do with things you don't know what to do with. He filed it away, promised himself he'd come back to it, and went to bed.
