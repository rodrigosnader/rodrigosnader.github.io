    - blockquote [ref=e23]:
      - paragraph [ref=e24]: "\"O que é um raio?\" \"Metade do diâmetro.\""
      - paragraph [ref=e25]: "\"E o diâmetro?\" \"Duas vezes o raio.\""
    - paragraph [ref=e26]: As duas frases são verdadeiras. Juntas, não explicam nada. Se você não sabia o que era um raio antes de ler, continua não sabendo. Cada definição aponta pra outra; nenhuma encosta no chão.
    - paragraph [ref=e27]: Esse padrão me persegue. Algo que tem cara de explicação, passa numa leitura desatenta, e desmorona à primeira pergunta de "mas por quê?"
    - paragraph [ref=e28]: "A forma da falha é sempre a mesma: um loop disfarçado de cadeia."
    - heading "Nível é dependência" [level=2] [ref=e29]
    - paragraph [ref=e30]: "Quando a gente diz que um conceito é \"mais baixo\" que outro, quer dizer uma coisa só: você precisa dele pra entender o de cima. Se você precisa de B pra entender A, B está abaixo. É isso."
    - paragraph [ref=e31]: Então o que está um nível abaixo de raio e diâmetro? O centro do círculo. Um círculo é o conjunto dos pontos equidistantes de um centro. O raio é a distância do centro até a borda. O diâmetro é a distância de uma ponta à outra, passando pelo centro. Nenhuma das palavras precisa da outra; as duas precisam do centro. E "centro", "distância", "borda" — nesse contexto, são palavras que você já tem. Não precisam ser explicadas. Esse é o chão.
    - paragraph [ref=e32]: "Cada camada se apoia em conceitos que pedem menos de você — conceitos mais perto de coisas que você só faria que sim com a cabeça. É isso que \"mais baixo\" quer dizer aqui: não necessariamente mais simples ou menor, só mais perto de uma base que você já está pisando."
    - paragraph [ref=e33]: Pergunta por que um programa quebrou e "porque tinha um bug" não te dá nada — é a quebra reformulada com outra palavra. "A função recebeu null porque a API devolveu uma resposta vazia e ninguém checou isso" tem etapas, cada uma apoiada na anterior. A primeira é um loop. A segunda é uma cadeia.
    - paragraph [ref=e34]: Isso é mais fácil de ver em código do que em texto. Uma função que se chama sem caso base estoura a stack — o compilador recusa. Linguagem natural não tem essa proteção. Explicações circulares compilam de boa em português, e é por isso que escritor cuidadoso faz a checagem na mão.
    - heading "A virtude dormitiva" [level=2] [ref=e35]
    - paragraph [ref=e36]:
      - link "Molière" [ref=e37] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/Le_Malade_imaginaire
      - text: encenou a versão canônica dessa armadilha em 1673. Em
      - emphasis [ref=e38]: Le Malade imaginaire
      - text: (
      - emphasis [ref=e39]: O doente imaginário
      - text: ), um candidato a médico é questionado por que o ópio faz dormir. Ele responde, em latim impressionante, que o ópio possui uma
      - emphasis [ref=e40]: virtus dormitiva
      - text: — uma "virtude dormitiva" — cuja natureza é fazer os sentidos adormecerem.
    - blockquote [ref=e41]:
      - paragraph [ref=e42]: "Traduzindo: o ópio te dá sono porque tem uma qualidade-que-causa-sono. O latim disfarça o fenômeno como se fosse a causa dele."
    - paragraph [ref=e43]: Isso importa porque o truque escala. Troca "virtude dormitiva" por qualquer mecanismo com cara técnica suficiente, e o mesmo movimento vazio passa pela inspeção. "O ópio ativa os receptores opioides, que induzem o sono." Isso é uma explicação? Depende se "receptores opioides" se desdobra em algo mais baixo — canais iônicos, potenciais de membrana, cascatas de sinalização. Se desdobra, você acrescentou um passo de verdade à cadeia.
    - figure [ref=e44]:
      - generic [ref=e46]:
