    - paragraph [ref=e68]: 2. Você fica sem orçamento. A cadeia tá sólida até aqui, mas o próximo passo te levaria pra um campo totalmente diferente. Tudo bem — rigor não é sobre chegar no fundo de todo conhecimento. É sobre saber onde a sua cadeia termina e que o elo onde você parou aguenta peso.
    - paragraph [ref=e69]: 3. Digamos que você loope. Você chega numa afirmação por onde já tinha passado, e a explicação está quebrada. Esse é o caso mais difícil de pegar — o círculo cabe confortavelmente na cabeça, e voltar ao ponto de partida tem cara de chegar a uma resposta. Escrever a cadeia no papel é o que torna ela visível. Texto linear é mais difícil de enganar do que linha de raciocínio.
    - heading "A ilusão de profundidade explicativa" [level=2] [ref=e70]
    - paragraph [ref=e71]: "Tem motivo pra explicações circulares parecerem ok dentro da cabeça. Psicólogos chamam isso de ilusão de profundidade explicativa: você acha que entende algo até ser convidado a explicar de verdade. Tenta explicar o que é um brinquedo sem mencionar pra que serve — sem brincar, sem diversão, sem entretenimento. Um objeto que... criança segura? Algo de plástico? Cada tentativa ou contrabandeia a função de volta com outra palavra, ou não diz nada útil. O conceito parecia sólido até a restrição revelar que ele estava todo apoiado na única coisa que você não podia dizer."
    - paragraph [ref=e72]: Acho que isso se aplica a mais coisa do que a gente tem coragem de admitir. Você "sabe" o que uma rede neural faz até alguém perguntar o que um neurônio faz e por que tem uma multiplicação ali. A primeira camada de entendimento é um nome — e o nome se apoia em familiaridade, não em mecanismo.
    - paragraph [ref=e73]: Não dá pra aterrar tudo. Em algum momento você toma um conceito como primitivo e para de empurrar. Físico aterra em campos. Químico para no átomo. Cozinheiro para em "sal". E provavelmente está tudo bem. Rigor não é sobre ir mais fundo — é sobre saber onde você parou.
    - paragraph [ref=e74]: "Então da próxima vez que você estiver escrevendo, ensinando ou tentando defender alguma coisa, pausa e traça: até onde isso desce?"
    - paragraph [ref=e75]: Toda argumentação tem um chão. Uma boa sabe onde o dela está.
