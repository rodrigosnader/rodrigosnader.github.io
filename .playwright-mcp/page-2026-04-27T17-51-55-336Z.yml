        - button "temperatura" [ref=e48] [cursor=pointer]
      - generic [ref=e49]:
        - generic [ref=e50]: Fig 1
        - text: Alterna entre uma explicação quebrada e uma aterrada. Se as setas formam um loop, a explicação é circular — nunca toca o chão. Se chegam em nós primitivos (coisas que você aceita sem precisar de explicação), é rigorosa.
    - heading "O teste do \"por quê?\"" [level=2] [ref=e51]
    - paragraph [ref=e52]:
      - text: A boa notícia é que tem como pegar isso. Pega qualquer explicação e fica perguntando
      - emphasis [ref=e53]: por quê
      - text: ", do jeito que criança faz antes de aprender quando parar. Cada resposta é uma nova afirmação; pergunta por quê de novo. Uma de três coisas acontece:"
    - paragraph [ref=e54]:
      - text: "1. Você toca o chão. Chega em algo que não precisa de mais definição — um conceito perto o bastante da rocha-mãe pra você parar naturalmente. Tem uma demonstração linda disso na Wikipedia: pega qualquer artigo, clica no primeiro link do corpo do texto, e segue. Cerca de 97% dos artigos eventualmente caem em"
      - emphasis [ref=e55]: Filosofia
      - text: . As definições vão encadeando em conceitos cada vez mais baixos até não sobrar pra onde ir além do estudo do próprio pensar.
